name: Quality checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python -m compileall -q app seed.py
      - run: node --check app/static/js/app.js
      - run: node --check app/static/js/admin.js
